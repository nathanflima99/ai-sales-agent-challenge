[project]
name = "ai-sales-agent"
version = "0.1.0"
description = "Agente de IA que responde perguntas em linguagem natural sobre dados de vendas"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "duckdb==1.5.5",
    "sqlglot==30.17.0",
    "langchain-core==1.6.1",
    "langchain-openai==1.6.0",
    "langchain-ollama==1.1.0",
    "langgraph==1.2.11",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "ruff==0.16.5",
    "mypy==2.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
# O ruff 0.16 formata blocos ```python dentro de Markdown. Os snippets da
# documentacao sao ilustrativos e nao devem ser reescritos pelo formatter.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
files = ["app"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: exige rede ou OPENAI_API_KEY"]
addopts = "-m 'not integration' -q"
